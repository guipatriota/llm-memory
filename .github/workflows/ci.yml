name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node --test app/test/config.test.cjs app/test/settings-hooks.test.cjs app/test/backfill.test.cjs
      - name: Syntax check
        shell: bash
        run: for f in app/cli.cjs app/lib/*.cjs; do node --check "$f"; done

  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y lintian
      - run: bash linux/build-deb.sh
      - uses: actions/upload-artifact@v5
        with:
          name: deb
          path: dist/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile installer
        shell: pwsh
        run: |
          $v = (Get-Content app/package.json | ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" windows\llm-memory.iss
      - uses: actions/upload-artifact@v5
        with:
          name: windows-setup
          path: dist/*.exe
